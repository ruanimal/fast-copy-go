name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-15
            platform: darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build packages
        shell: bash
        run: |
          go tool mygo build -platform '${{ matrix.platform }}/amd64,${{ matrix.platform }}/arm64'
      - name: Check package outputs
        run: .github/scripts/check-packages.sh '${{ matrix.platform }}'
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.platform }}
          path: |
            dist/**/*.deb
            dist/**/*.rpm
            dist/**/*.tar.gz
            dist/**/*.dmg
          if-no-files-found: error
          retention-days: 7
